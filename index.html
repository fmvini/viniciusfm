<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1216" />
    <meta name="description" content="Portfólio de Vinícius F. Marrocos, desenvolvedor fullstack. Projetos em React, TypeScript, Python e FastAPI." />
    <meta name="author" content="Vinícius F. Marrocos" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vinícius F. Marrocos — Desenvolvedor Fullstack" />
    <meta property="og:description" content="Conheça meus projetos, stack, formação e formas de contato." />
    <meta property="og:locale" content="pt_BR" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vinícius F. Marrocos — Desenvolvedor Fullstack</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('portfolio-theme')
        document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark'
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('motion-ready')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
